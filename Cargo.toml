[package]
name = "kobo-backup"
version = "0.1.0"
edition = "2021"
description = "Transparency-first backup & restore TUI for Kobo e-readers"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humansize = "2"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
tempfile = "3"

[dev-dependencies]
assert_fs = "1"

[profile.release]
lto = true
